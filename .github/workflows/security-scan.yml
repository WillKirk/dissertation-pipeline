name: Security Scan

on:
  push:
    branches:
      - main

jobs:
  semgrep:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/security-audit
        continue-on-error: true

  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 0
          severity: LOW,MEDIUM,HIGH,CRITICAL
          scanners: vuln,secret,misconfig

  snyk:
      name: Snyk Security Scan
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Setup Python
          uses: actions/setup-python@v5
          with:
            python-version: "3.10"

        - name: Install dependencies
          run: pip install -r requirements.txt

        - name: Install Snyk CLI
          run: npm install -g snyk

        - name: Authenticate Snyk
          env:
            SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          run: snyk auth $SNYK_TOKEN

        - name: Run Snyk Open Source scan
          env:
            SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          run: snyk test --severity-threshold=low --json > snyk_opensource_results.json || true

        - name: Run Snyk Code scan
          env:
            SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          run: snyk code test --severity-threshold=low > snyk_code_results.txt || true

        - name: Run Snyk IaC scan
          env:
            SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          run: snyk iac test infrastructure/ --severity-threshold=low > snyk_iac_results.txt || true

        - name: Upload Snyk results
          uses: actions/upload-artifact@v4
          with:
            name: snyk-results
            path: |
              snyk_opensource_results.json
              snyk_code_results.txt
              snyk_iac_results.txt

  claude-neutral:
    name: Claude Sonnet Security Review (Neutral Prompt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install anthropic==0.79.0

      - name: Run Claude neutral scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/claude_scan_neutral.py

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: claude-neutral-results
          path: claude_neutral_results.txt

  claude-security-aware:
    name: Claude Sonnet Security Review (Security-Aware Prompt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install anthropic==0.79.0

      - name: Run Claude security-aware scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/claude_scan_security_aware.py

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: claude-security-aware-results
          path: claude_security_aware_results.txt
